[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeta-explorer"
version = "0.1.0"
description = "Explore the Riemann zeta function from scratch: Riemann-Siegel Z, zeta(s), Gram blocks, Turing verification, fast multi-evaluation of Z, the explicit formula for pi(x), Lehmer pairs, value distributions, and Dirichlet L-functions up to conductor 1e5 with their low-lying zeros, ratios-conjecture lower-order terms and Fredholm-determinant first-zero laws, elliptic curve L-functions with their quadratic twists against the excised orthogonal ensemble and the ratios conjecture through the symmetric square, Chebyshev's bias in prime races computed from the zeros, moments of zeta against the CFKRS polynomials with the arithmetic factor, Li's coefficients from a million zeros, Jensen polynomials of xi decided hyperbolic in exact arithmetic, the maximum of zeta over short intervals against the Fyodorov-Hiary-Keating law, the de Bruijn-Newman heat flow through Polymath 15's effective approximation out to x = 2e12 and its bound Lambda <= 0.22 recomputed through the barrier at 6e10 and the Euler-mollified triangle inequality, the Davenport-Heilbronn function and its zeros off the line, Ramanujan's Delta L-function and the Sato-Tate law for tau(p), Dedekind zeta functions of quadratic fields, zero counts and Platt's zeros certified in ball arithmetic, the Mertens conjecture disproved with LLL on certified zeros, and Lehman's theorem locating where pi(x) first exceeds li(x)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Louis Belot" }]
keywords = ["riemann-zeta", "riemann-hypothesis", "number-theory", "visualization", "riemann-siegel", "explicit-formula", "random-matrix-theory", "nufft", "odlyzko-schonhage", "dirichlet-l-functions", "katz-sarnak", "approximate-functional-equation", "ratios-conjecture", "fredholm-determinant", "elliptic-curves", "quadratic-twists", "symmetric-square", "chebyshev-bias", "prime-races", "moments", "li-criterion", "jensen-polynomials", "extreme-values", "davenport-heilbronn", "de-bruijn-newman", "interval-arithmetic", "arb", "ramanujan-tau", "sato-tate", "dedekind-zeta", "class-number", "mertens-conjecture", "lattice-reduction", "skewes-number"]
dependencies = [
    "numpy>=1.24",
    "mpmath>=1.4",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
certified = ["python-flint>=0.9"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7", "python-flint>=0.9"]

[project.urls]
Homepage = "https://github.com/louisbelot/zeta-explorer"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
